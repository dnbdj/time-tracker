name: Create GitHub Release

# Pushing a tag like v1.2.0 publishes that version as a GitHub Release.
# Notes come from releases/<version>.md, the APK from
# apk/time-tracker-<version>.apk when present (older versions are notes-only).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          ARGS=(--title "Time Tracker ${TAG}")
          if [ -f "releases/${VER}.md" ]; then ARGS+=(--notes-file "releases/${VER}.md"); fi
          if [ -f "apk/time-tracker-${VER}.apk" ]; then ARGS+=("apk/time-tracker-${VER}.apk"); fi
          gh release create "${TAG}" "${ARGS[@]}"
